<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YYShell 插件</title>
    <style>
      /* Prevent white flash - set initial dark background */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #1a1a2e;
        min-height: 100vh;
      }
      #plugin-root {
        min-height: 100vh;
        background-color: #1a1a2e;
      }
      /* Loading spinner */
      .plugin-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #888;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .plugin-loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(100, 100, 255, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .plugin-loading-text {
        margin-top: 12px;
        font-size: 14px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="plugin-root">
      <div class="plugin-loading">
        <div class="plugin-loading-spinner"></div>
        <div class="plugin-loading-text">加载插件中...</div>
      </div>
    </div>
    <script type="module" src="/src/plugin-main.tsx"></script>
  </body>
</html>
