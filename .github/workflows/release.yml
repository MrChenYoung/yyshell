name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS-ARM64'
          - platform: 'macos-15'
            args: '--target x86_64-apple-darwin'
            name: 'macOS-Intel'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (matrix.platform == 'macos-latest' || matrix.platform == 'macos-15') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YYShell ${{ github.ref_name }}'
          releaseBody: |
            ## YYShell ${{ github.ref_name }}
            
            ### 功能特性
            - 🖥️ SSH 终端连接
            - 📁 SFTP 文件管理
            - 📊 实时系统监控
            - ⚡ 快捷命令管理
            - 🔐 加密备份/恢复
            
            ### 下载说明
            - **macOS (Apple Silicon M1/M2/M3/M4)**: 下载 `_aarch64.dmg`
            - **macOS (Intel)**: 下载 `_x64.dmg`
            - **Windows**: 下载 `.msi` 或 `.exe`
            - **Linux**: 下载 `.deb` 或 `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
